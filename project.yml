
name: DaniXNixi
options:
  bundleIdPrefix: com.dani.nixi
  deploymentTarget:
    iOS: "16.0"

targets:
  DaniXNixi:
    type: application
    platform: iOS
    sources:
      - DaniXNixiApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dani.nixi.app
        PRODUCT_NAME: DaniXNixi
        SWIFT_VERSION: "5.9"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        
